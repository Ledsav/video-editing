<!doctype html>
<!-- Radial anime-style speed lines that flicker around the frame edges, focusing attention on the center. For impacts, drops and hero moments.
     variables: color: CSS color; density: lines count; inner: clear radius 0..1; seed: int; opacity: 0..1 -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
      #root { position: absolute; inset: 0; overflow: hidden; }
html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; } canvas { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="speed-lines" data-start="0" data-duration="1" data-width="1920" data-height="1080" data-vedit-kind="overlay">
<canvas id="cv"></canvas>
    </div>
    <script src="assets/vedit/vm-shim.js"></script>
    <script>

  const P = VM.params({ color: '#ffffff', density: 90, inner: 0.42, seed: 4, opacity: 0.85 });
  const cv = document.getElementById('cv'), W = cv.width = innerWidth, H = cv.height = innerHeight, g = cv.getContext('2d');
  const R = Math.hypot(W, H) / 2;
  VM.onFrame((t) => {
    const D = VM.duration; g.clearRect(0, 0, W, H);
    const rnd = VM.rand(P.seed * 7919 + Math.floor(t * 30));
    const env = VM.prog(t, 0, 0.08) * (1 - VM.prog(t, D - 0.25, 0.25));
    g.fillStyle = P.color; g.globalAlpha = P.opacity * env;
    for (let i = 0; i < P.density; i++) {
      const a = rnd() * Math.PI * 2, w = (0.002 + rnd() * 0.012) * Math.PI;
      const r0 = R * (P.inner + rnd() * 0.25);
      g.beginPath();
      g.moveTo(W / 2 + Math.cos(a) * r0, H / 2 + Math.sin(a) * r0);
      g.lineTo(W / 2 + Math.cos(a - w) * R * 1.1, H / 2 + Math.sin(a - w) * R * 1.1);
      g.lineTo(W / 2 + Math.cos(a + w) * R * 1.1, H / 2 + Math.sin(a + w) * R * 1.1);
      g.closePath(); g.fill();
    }
  });
      window.__timelines = window.__timelines || {};
      window.__timelines[VM.id] = VM.start();
    </script>
  </body>
</html>
