<!doctype html>
<!-- Celluloid burn: hot orange flare blooms from an edge to blown-out white at the cut, then cools away. Screen-blended.
     variables: origin: [x, y] in 0..1; hot: CSS color; warm: CSS color -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
      #root { position: absolute; inset: 0; overflow: hidden; }

  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
  #burn, #core, #flash { position: absolute; inset: 0; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="film-burn" data-start="0" data-duration="1.2" data-width="1920" data-height="1080" data-vedit-blend="screen" data-vedit-cover-at="0.55" data-vedit-kind="transition">
<div id="burn"></div><div id="core"></div><div id="flash"></div>
    </div>
    <script src="assets/vedit/vm-shim.js"></script>
    <script>

  const P = VM.params({ origin: [0.85, 0.2], hot: '#fff3d6', warm: '#ff5a00', deep: '#a10a00' });
  const ox = P.origin[0] * 100, oy = P.origin[1] * 100;
  const burn = document.getElementById('burn'), core = document.getElementById('core'), flash = document.getElementById('flash');
  flash.style.background = P.hot;
  VM.onFrame((t) => {
    const D = VM.duration, C = D * (0.55 / 1.2); // cover point (matches vedit:cover-at)
    const grow = VM.prog(t, 0, C, 'inQuad');
    const fade = VM.prog(t, C, D - C, 'outCubic');
    const jit = 4 * VM.noise(t * 18, 2);
    const r1 = 10 + grow * 160 + jit, r2 = r1 * 0.55, r3 = r1 * 0.25;
    burn.style.background = `radial-gradient(circle at ${ox}% ${oy}%, ${P.hot} 0%, ${P.warm} ${r3}%, ${P.deep} ${r2}%, transparent ${r1}%)`;
    core.style.background = `radial-gradient(circle at ${ox + jit}% ${oy - jit}%, ${P.hot} 0%, transparent ${r2 * 0.8}%)`;
    core.style.opacity = VM.clamp(grow * 1.4);
    flash.style.opacity = VM.prog(t, C - D * 0.12, D * 0.12, 'inQuad') * (1 - fade);
    burn.style.opacity = 1 - fade;
    core.style.opacity = (1 - fade) * VM.clamp(grow * 1.4);
  });
      window.__timelines = window.__timelines || {};
      window.__timelines[VM.id] = VM.start();
    </script>
  </body>
</html>
