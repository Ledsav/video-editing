<!doctype html>
<!-- Digital glitch title: RGB-split copies jitter and the text tears into horizontal slices in bursts, settling into a clean read. Tech, gaming, hype.
     variables: text; color: CSS color; split: [2 CSS colors for the RGB ghosts]; font: CSS font-family; size: vh; seed: int -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
      #root { position: absolute; inset: 0; overflow: hidden; }

  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  .layer { position: absolute; left: 50%; top: 50%; white-space: nowrap; line-height: 1; mix-blend-mode: screen; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="glitch-title" data-start="0" data-duration="3" data-width="1920" data-height="1080" data-vedit-kind="title">

    </div>
    <script src="assets/vedit/vm-shim.js"></script>
    <script>

  const P = VM.params({ text: 'SYSTEM ONLINE', color: '#ffffff', split: ['#ff0040', '#00e5ff'], font: "'Archivo Black', 'Anton', sans-serif", size: 13, seed: 5 });
  const mk = (color) => { const e = document.createElement('div'); e.className = 'layer'; e.textContent = P.text; e.style.font = `400 ${P.size}vh ${P.font}`; e.style.color = color; VM.root.appendChild(e); return e; };
  const r = mk(P.split[0]), b = mk(P.split[1]), w = mk(P.color);
  const slices = 6;
  VM.onFrame((t) => {
    const D = VM.duration, rnd = VM.rand(P.seed * 1000 + Math.floor(t * 24));
    const burst = (t < 0.5) || (t > 1.3 && t < 1.45) || (t > D - 0.5);
    const amp = burst ? 1 : 0.06;
    const vis = VM.clamp(t / 0.12) * (1 - VM.prog(t, D - 0.15, 0.15));
    for (const [e, k] of [[r, -1], [b, 1], [w, 0]]) {
      const dx = k * (0.6 + rnd() * 2.2) * amp + (k === 0 && burst ? (rnd() - 0.5) * 2 : 0);
      e.style.transform = `translate(calc(-50% + ${dx}vh), calc(-50% + ${(rnd() - 0.5) * amp}vh))`;
      e.style.opacity = vis * (burst && rnd() < 0.15 ? 0.3 : 1);
      if (burst && k === 0) {
        const top = rnd() * 100, h = 4 + rnd() * 18;
        e.style.clipPath = rnd() < 0.5 ? `inset(${top}% 0 ${Math.max(0, 100 - top - h)}% 0)` : 'none';
      } else e.style.clipPath = 'none';
    }
  });
      window.__timelines = window.__timelines || {};
      window.__timelines[VM.id] = VM.start();
    </script>
  </body>
</html>
