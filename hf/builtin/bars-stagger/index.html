<!doctype html>
<!-- Vertical bars drop in one after another to cover the frame, then retract downward to reveal the next shot.
     variables: colors: [CSS colors, alternated]; count: number of bars; direction: down|up -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
      #root { position: absolute; inset: 0; overflow: hidden; }

  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  .bar { position: absolute; top: 0; height: 100vh; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="bars-stagger" data-start="0" data-duration="1" data-width="1920" data-height="1080" data-vedit-cover-at="0.5" data-vedit-kind="transition">

    </div>
    <script src="assets/vedit/vm-shim.js"></script>
    <script>

  const P = VM.params({ colors: ['#111111', '#f5f5f0'], count: 7, direction: 'down' });
  const n = Math.max(2, P.count | 0), bars = [];
  for (let i = 0; i < n; i++) {
    const b = document.createElement('div');
    b.className = 'bar';
    b.style.left = (i * 100 / n - 0.05) + 'vw';
    b.style.width = (100 / n + 0.1) + 'vw';
    b.style.background = P.colors[i % P.colors.length];
    VM.root.appendChild(b); bars.push(b);
  }
  const down = P.direction !== 'up';
  VM.onFrame((t) => {
    const D = VM.duration, C = D * 0.5, stag = D * 0.25 / n, dur = C - stag * (n - 1);
    bars.forEach((b, i) => {
      const pin = VM.prog(t, i * stag, dur, 'outCubic');
      const pout = VM.prog(t, C + i * stag, dur, 'inCubic');
      if (pout <= 0) { b.style.transformOrigin = down ? 'top' : 'bottom'; b.style.transform = `scaleY(${pin})`; }
      else { b.style.transformOrigin = down ? 'bottom' : 'top'; b.style.transform = `scaleY(${1 - pout})`; }
    });
  });
      window.__timelines = window.__timelines || {};
      window.__timelines[VM.id] = VM.start();
    </script>
  </body>
</html>
