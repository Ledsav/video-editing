<!doctype html>
<!-- Logo / wordmark reveal: the outline of the name draws itself, a ring traces around it, the letters fill with colour, a soft light sweeps across and the tagline fades up. For openers, end cards, brand stings.
     variables: text; tagline; bg, fg, accent: CSS colours; font: CSS font-family; ring: true|false -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
      #root { position: absolute; inset: 0; overflow: hidden; }

  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #tag { position: absolute; left: 0; right: 0; text-align: center; font: 600 2.6vmin 'Montserrat', sans-serif; letter-spacing: 0.6em; padding-left: 0.6em; text-transform: uppercase; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene-logo-reveal" data-start="0" data-duration="5" data-width="1920" data-height="1080" data-vedit-kind="scene">
<svg id="svg"><defs>
  <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0.2"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="clip"><text id="clipText" text-anchor="middle" dominant-baseline="central"></text></clipPath>
</defs>
  <circle id="ring" fill="none" stroke-width="3"/>
  <text id="word" text-anchor="middle" dominant-baseline="central" fill-opacity="0" stroke-width="2"></text>
  <rect id="shine" clip-path="url(#clip)" fill="url(#sweep)"/>
</svg>
<div id="tag"></div>
    </div>
    <script src="assets/vedit/vm-shim.js"></script>
    <script>

  const P = VM.params({ text: 'ORGOSOLO', tagline: 'Cortes Apertas · 2026', bg: '#121110', fg: '#f4efe6', accent: '#e8b04a',
                        font: "'Playfair Display', serif", ring: true });
  VM.root.style.background = P.bg;
  const W = innerWidth, H = innerHeight, cx = W / 2, cy = H * 0.47;
  const fs = Math.min(W * 1.6 / Math.max(P.text.length, 4), H * 0.22);
  const word = document.getElementById('word'), clipText = document.getElementById('clipText');
  for (const el of [word, clipText]) {
    el.textContent = P.text; el.setAttribute('x', cx); el.setAttribute('y', cy);
    el.style.font = `900 ${fs}px ${P.font}`; el.style.letterSpacing = '0.04em';
  }
  word.setAttribute('stroke', P.fg); word.setAttribute('fill', P.fg);
  word.style.strokeDasharray = `${fs * 3} ${fs * 3}`;
  const ring = document.getElementById('ring');
  const r = Math.min(W * 0.46, Math.max(fs * P.text.length * 0.38, fs * 1.4));
  ring.setAttribute('cx', cx); ring.setAttribute('cy', cy); ring.setAttribute('r', r); ring.setAttribute('stroke', P.accent);
  ring.style.display = P.ring ? '' : 'none';
  const shine = document.getElementById('shine');
  shine.setAttribute('y', cy - fs); shine.setAttribute('height', fs * 2); shine.setAttribute('width', W * 0.35);
  const tag = document.getElementById('tag'); tag.textContent = P.tagline; tag.style.color = P.accent; tag.style.top = `${(cy + Math.max(r, fs) * 0.75) / H * 100}vh`;
  VM.onFrame((t) => {
    const D = VM.duration, out = VM.prog(t, D - 0.5, 0.5, 'inCubic');
    word.style.strokeDashoffset = String(fs * 3 * (1 - VM.prog(t, 0.1, 1.6, 'inOutCubic')));
    word.setAttribute('fill-opacity', VM.prog(t, 1.4, 0.7, 'inOutSine'));
    word.setAttribute('stroke-opacity', 1 - VM.prog(t, 1.9, 0.5));
    VM.draw(ring, VM.prog(t, 0.4, 1.4, 'inOutExpo'));
    ring.setAttribute('transform', `rotate(${-90 + 40 * VM.prog(t, 0, D, 'outCubic')} ${cx} ${cy})`);
    shine.setAttribute('x', VM.lerp(cx - W * 0.6, cx + W * 0.3, VM.prog(t, 2.1, 1.1, 'inOutCubic')));
    tag.style.opacity = VM.prog(t, 2.4, 0.8) * (1 - out);
    tag.style.letterSpacing = VM.lerp(0.9, 0.6, VM.prog(t, 2.4, 1.2, 'outCubic')) + 'em';
    document.getElementById('svg').style.opacity = 1 - out;
    document.getElementById('svg').style.transform = `scale(${1 + 0.03 * VM.prog(t, 0, D)})`;
  });
      window.__timelines = window.__timelines || {};
      window.__timelines[VM.id] = VM.start();
    </script>
  </body>
</html>
