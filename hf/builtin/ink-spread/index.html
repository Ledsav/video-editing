<!doctype html>
<!-- An organic ink blot bleeds outward to flood the frame, then dissolves from its center. Elegant for documentary, art, fashion.
     variables: color: CSS color; origin: [x, y] in 0..1; roughness: 0..1 -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
      #root { position: absolute; inset: 0; overflow: hidden; }
html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; } svg { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ink-spread" data-start="0" data-duration="1.4" data-width="1920" data-height="1080" data-vedit-cover-at="0.7" data-vedit-kind="transition">
<svg id="svg" width="100%" height="100%">
  <defs>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap id="disp" in="SourceGraphic" in2="n" scale="160" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <mask id="m" maskUnits="userSpaceOnUse">
      <g filter="url(#rough)">
        <circle id="outer" fill="#fff" r="0"/>
        <circle id="inner" fill="#000" r="0"/>
      </g>
    </mask>
  </defs>
  <rect id="ink" width="100%" height="100%" mask="url(#m)"/>
</svg>
    </div>
    <script src="assets/vedit/vm-shim.js"></script>
    <script>

  const P = VM.params({ color: '#0b0b0b', origin: [0.5, 0.55], roughness: 0.7 });
  const W = innerWidth, H = innerHeight;
  const ox = P.origin[0] * W, oy = P.origin[1] * H;
  const R = Math.hypot(Math.max(ox, W - ox), Math.max(oy, H - oy)) * 1.35;
  const outer = document.getElementById('outer'), inner = document.getElementById('inner');
  document.getElementById('ink').setAttribute('fill', P.color);
  document.getElementById('disp').setAttribute('scale', String(Math.round(Math.min(W, H) * 0.25 * P.roughness)));
  for (const c of [outer, inner]) { c.setAttribute('cx', ox); c.setAttribute('cy', oy); }
  VM.onFrame((t) => {
    const D = VM.duration, C = D * 0.5;
    outer.setAttribute('r', R * VM.prog(t, 0, C, 'inOutCubic'));
    inner.setAttribute('r', R * VM.prog(t, C, D - C, 'inOutCubic'));
  });
      window.__timelines = window.__timelines || {};
      window.__timelines[VM.id] = VM.start();
    </script>
  </body>
</html>
