<!doctype html>
<!-- Three layered, skewed color bands sweep across and fully cover the frame at the cut, then peel away in reverse order.
     variables: colors: [3 CSS colors, bottom to top]; direction: left|right|up|down; skew: degrees -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
      #root { position: absolute; inset: 0; overflow: hidden; }

  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #stage { position: absolute; left: 50%; top: 50%; width: 100vw; height: 100vh; transform: translate(-50%, -50%); }
  .band { position: absolute; top: -30%; height: 160%; width: 150%; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="shape-wipe" data-start="0" data-duration="1" data-width="1920" data-height="1080" data-vedit-cover-at="0.5" data-vedit-kind="transition">
<div id="stage"><div class="band" id="b0"></div><div class="band" id="b1"></div><div class="band" id="b2"></div></div>
    </div>
    <script src="assets/vedit/vm-shim.js"></script>
    <script>

  const P = VM.params({ colors: ['#ff3d00', '#ffd400', '#0d0d0d'], direction: 'left', skew: -16 });
  const stage = document.getElementById('stage');
  const vertical = P.direction === 'up' || P.direction === 'down';
  if (vertical) { stage.style.width = '100vh'; stage.style.height = '100vw'; }
  const rot = { left: 0, right: 180, up: 90, down: -90 }[P.direction] || 0;
  stage.style.transform = `translate(-50%, -50%) rotate(${rot}deg)`;
  const bands = [0, 1, 2].map((i) => {
    const b = document.getElementById('b' + i);
    b.style.background = P.colors[i % P.colors.length];
    b.style.transform = `skewX(${P.skew}deg)`;
    return b;
  });
  VM.onFrame((t) => {
    const D = VM.duration, C = D * 0.5, s = D * 0.06, dur = D * 0.36;
    bands.forEach((b, i) => {
      const k = 2 - i;                         // top band arrives last, leaves first
      const enterEnd = C - k * s, exitStart = C + k * s;
      const pin = VM.prog(t, enterEnd - dur, dur, 'inOutCubic');
      const pout = VM.prog(t, exitStart, dur, 'inOutCubic');
      const x = VM.lerp(110, -25, pin) + VM.lerp(0, -165, pout);
      b.style.left = x + '%';
    });
  });
      window.__timelines = window.__timelines || {};
      window.__timelines[VM.id] = VM.start();
    </script>
  </body>
</html>
