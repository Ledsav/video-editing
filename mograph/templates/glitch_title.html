<!doctype html>
<html><head><meta charset="utf-8">
<meta name="vedit:kind" content="title">
<meta name="vedit:duration" content="3.0">
<meta name="vedit:description" content="Digital glitch title: RGB-split copies jitter and the text tears into horizontal slices in bursts, settling into a clean read. Tech, gaming, hype.">
<meta name="vedit:params" content="text; color: CSS color; split: [2 CSS colors for the RGB ghosts]; font: CSS font-family; size: vh; seed: int">
<script src="../lib/runtime.js"></script>
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  .layer { position: absolute; left: 50%; top: 50%; white-space: nowrap; line-height: 1; mix-blend-mode: screen; }
</style></head>
<body>
<script>
  const P = VM.params({ text: 'SYSTEM ONLINE', color: '#ffffff', split: ['#ff0040', '#00e5ff'], font: "'Archivo Black', 'Anton', sans-serif", size: 13, seed: 5 });
  const mk = (color) => { const e = document.createElement('div'); e.className = 'layer'; e.textContent = P.text; e.style.font = `400 ${P.size}vh ${P.font}`; e.style.color = color; document.body.appendChild(e); return e; };
  const r = mk(P.split[0]), b = mk(P.split[1]), w = mk(P.color);
  const slices = 6;
  VM.onFrame((t) => {
    const D = VM.duration, rnd = VM.rand(P.seed * 1000 + Math.floor(t * 24));
    const burst = (t < 0.5) || (t > 1.3 && t < 1.45) || (t > D - 0.5);
    const amp = burst ? 1 : 0.06;
    const vis = VM.clamp(t / 0.12) * (1 - VM.prog(t, D - 0.15, 0.15));
    for (const [e, k] of [[r, -1], [b, 1], [w, 0]]) {
      const dx = k * (0.6 + rnd() * 2.2) * amp + (k === 0 && burst ? (rnd() - 0.5) * 2 : 0);
      e.style.transform = `translate(calc(-50% + ${dx}vh), calc(-50% + ${(rnd() - 0.5) * amp}vh))`;
      e.style.opacity = vis * (burst && rnd() < 0.15 ? 0.3 : 1);
      if (burst && k === 0) {
        const top = rnd() * 100, h = 4 + rnd() * 18;
        e.style.clipPath = rnd() < 0.5 ? `inset(${top}% 0 ${Math.max(0, 100 - top - h)}% 0)` : 'none';
      } else e.style.clipPath = 'none';
    }
  });
</script></body></html>
