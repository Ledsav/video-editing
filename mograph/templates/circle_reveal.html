<!doctype html>
<html><head><meta charset="utf-8">
<meta name="vedit:kind" content="transition">
<meta name="vedit:duration" content="1.1">
<meta name="vedit:cover-at" content="0.55">
<meta name="vedit:description" content="Concentric color rings burst from a point to cover the frame, then a hole opens from the same point to reveal the next shot.">
<meta name="vedit:params" content="colors: [2 CSS colors]; origin: [x, y] in 0..1">
<script src="../lib/runtime.js"></script>
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  .ring { position: absolute; inset: 0; }
</style></head>
<body><div class="ring" id="r0"></div><div class="ring" id="r1"></div>
<script>
  const P = VM.params({ colors: ['#ffffff', '#ff2d55'], origin: [0.5, 0.5] });
  const W = innerWidth, H = innerHeight;
  const ox = P.origin[0] * W, oy = P.origin[1] * H;
  const R = Math.hypot(Math.max(ox, W - ox), Math.max(oy, H - oy)) + 4;
  const rings = [0, 1].map((i) => { const r = document.getElementById('r' + i); r.style.background = P.colors[i % P.colors.length]; return r; });
  VM.onFrame((t) => {
    const D = VM.duration, C = D * 0.5;
    rings.forEach((r, i) => {
      const lag = i * D * 0.08;               // ring 1 (top) arrives later, opens earlier
      const outer = R * VM.prog(t, lag, C - lag, 'inOutQuart');
      const inner = R * VM.prog(t, C + (1 - i) * D * 0.08, C - D * 0.08, 'inOutQuart');
      r.style.clipPath = `circle(${outer}px at ${ox}px ${oy}px)`;
      const m = `radial-gradient(circle at ${ox}px ${oy}px, transparent ${inner}px, #000 ${inner + 0.5}px)`;
      r.style.maskImage = m; r.style.webkitMaskImage = m;
    });
  });
</script></body></html>
