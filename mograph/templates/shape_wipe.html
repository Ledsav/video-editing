<!doctype html>
<html><head><meta charset="utf-8">
<meta name="vedit:kind" content="transition">
<meta name="vedit:duration" content="1.0">
<meta name="vedit:cover-at" content="0.5">
<meta name="vedit:description" content="Three layered, skewed color bands sweep across and fully cover the frame at the cut, then peel away in reverse order.">
<meta name="vedit:params" content="colors: [3 CSS colors, bottom to top]; direction: left|right|up|down; skew: degrees">
<script src="../lib/runtime.js"></script>
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #stage { position: absolute; left: 50%; top: 50%; width: 100vw; height: 100vh; transform: translate(-50%, -50%); }
  .band { position: absolute; top: -30%; height: 160%; width: 150%; }
</style></head>
<body><div id="stage"><div class="band" id="b0"></div><div class="band" id="b1"></div><div class="band" id="b2"></div></div>
<script>
  const P = VM.params({ colors: ['#ff3d00', '#ffd400', '#0d0d0d'], direction: 'left', skew: -16 });
  const stage = document.getElementById('stage');
  const vertical = P.direction === 'up' || P.direction === 'down';
  if (vertical) { stage.style.width = '100vh'; stage.style.height = '100vw'; }
  const rot = { left: 0, right: 180, up: 90, down: -90 }[P.direction] || 0;
  stage.style.transform = `translate(-50%, -50%) rotate(${rot}deg)`;
  const bands = [0, 1, 2].map((i) => {
    const b = document.getElementById('b' + i);
    b.style.background = P.colors[i % P.colors.length];
    b.style.transform = `skewX(${P.skew}deg)`;
    return b;
  });
  VM.onFrame((t) => {
    const D = VM.duration, C = D * 0.5, s = D * 0.06, dur = D * 0.36;
    bands.forEach((b, i) => {
      const k = 2 - i;                         // top band arrives last, leaves first
      const enterEnd = C - k * s, exitStart = C + k * s;
      const pin = VM.prog(t, enterEnd - dur, dur, 'inOutCubic');
      const pout = VM.prog(t, exitStart, dur, 'inOutCubic');
      const x = VM.lerp(110, -25, pin) + VM.lerp(0, -165, pout);
      b.style.left = x + '%';
    });
  });
</script></body></html>
