<!doctype html>
<html><head><meta charset="utf-8">
<meta name="vedit:kind" content="title">
<meta name="vedit:duration" content="4.0">
<meta name="vedit:description" content="Cinematic title: kicker types on, title lines rise out of masks, an accent rule draws, subtitle tracks in; everything lifts away at the end. Optional solid background turns it into a full-screen card.">
<meta name="vedit:params" content="title (use \n for lines); subtitle; kicker; accent: CSS color; color: CSS color; background: 'transparent' or CSS color; font: CSS font-family; align: center|left; size: title size in vh">
<script src="../lib/runtime.js"></script>
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  #bg { position: absolute; inset: 0; }
  #wrap { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 9vw; box-sizing: border-box; }
  .kicker { font: 600 2.2vh 'Space Grotesk', 'Montserrat', 'Inter', sans-serif; letter-spacing: 0.6em; text-transform: uppercase; margin-bottom: 2.4vh; }
  .line { overflow: hidden; line-height: 0.92; padding: 0.06em 0; }
  .line span { display: inline-block; }
  .rule { height: 0.45vh; width: 18vw; margin: 3vh 0 2.6vh; transform-origin: left center; }
  .sub { font: 500 2.6vh 'Montserrat', 'Inter', sans-serif; letter-spacing: 0.35em; text-transform: uppercase; }
</style></head>
<body><div id="bg"></div><div id="wrap"></div>
<script>
  const P = VM.params({ title: 'THE LONG ROAD\nHOME', subtitle: 'A short film', kicker: '', accent: '#ff4d2e', color: '#ffffff',
                        background: 'transparent', font: "'Bebas Neue', 'Anton', 'Oswald', sans-serif", align: 'center', size: 16 });
  const wrap = document.getElementById('wrap'), bg = document.getElementById('bg');
  bg.style.background = P.background;
  wrap.style.color = P.color;
  wrap.style.alignItems = P.align === 'left' ? 'flex-start' : 'center';
  wrap.style.textAlign = P.align === 'left' ? 'left' : 'center';
  let kickSpans = [];
  if (P.kicker) {
    const k = document.createElement('div'); k.className = 'kicker'; k.textContent = P.kicker; k.style.color = P.accent;
    wrap.appendChild(k); kickSpans = VM.split(k);
  }
  const lines = String(P.title).split('\n').map((txt) => {
    const l = document.createElement('div'); l.className = 'line';
    l.style.font = `400 ${P.size}vh ${P.font}`; l.style.letterSpacing = '0.02em';
    const s = document.createElement('span'); s.textContent = txt; l.appendChild(s); wrap.appendChild(l);
    return s;
  });
  const rule = document.createElement('div'); rule.className = 'rule'; rule.style.background = P.accent;
  if (P.align !== 'left') rule.style.transformOrigin = 'center';
  wrap.appendChild(rule);
  const sub = document.createElement('div'); sub.className = 'sub'; sub.textContent = P.subtitle || ''; wrap.appendChild(sub);
  VM.onFrame((t) => {
    const D = VM.duration, out = D - 0.7;
    bg.style.opacity = P.background === 'transparent' ? 0 : 1 - VM.prog(t, D - 0.35, 0.35, 'inQuad');
    kickSpans.forEach((s, i) => { s.style.opacity = t > 0.05 + i * 0.03 ? 1 - VM.prog(t, out, 0.4) : 0; });
    lines.forEach((s, i) => {
      const pin = VM.prog(t, 0.25 + i * 0.12, 0.9, 'outExpo');
      const pout = VM.prog(t, out + i * 0.06, 0.55, 'inExpo');
      s.style.transform = `translateY(${(1 - pin) * 110 - pout * 110}%)`;
    });
    rule.style.transform = `scaleX(${VM.prog(t, 0.7, 0.8, 'inOutExpo') * (1 - VM.prog(t, out, 0.45, 'inOutCubic'))})`;
    const ps = VM.prog(t, 0.95, 1.0, 'outCubic');
    sub.style.opacity = ps * (1 - VM.prog(t, out - 0.1, 0.4));
    sub.style.letterSpacing = VM.lerp(0.9, 0.35, ps) + 'em';
  });
</script></body></html>
