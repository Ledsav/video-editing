<!doctype html>
<html><head><meta charset="utf-8">
<meta name="vedit:kind" content="scene">
<meta name="vedit:duration" content="1">
<meta name="vedit:libs" content="three">
<script src="../scenes/common.js"></script>
<script src="mikasa.js"></script>
<style>html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #f1f1f1; } img { position: absolute; left: 4vw; top: 8vh; height: 84vh; }</style></head>
<body><div id="stage"><img src="../ref/v200w.jpg"></div>
<script>
  const P = VM.params({ rx: 0.05, ry: -1.57, rz: -0.22, views: [[0.25, 0.6, 0], [-0.9, 2.2, 0.4]] });
  window.VM_READY = (async () => {
    const m = await createMikasa({ size: 64, key: [-1.5, 2.5, 4], rim: 0xffffff, rimI: 0.4 });
    m.canvas.style.left = 'calc(73vw - 32vmin)'; m.canvas.style.top = 'calc(50vh - 32vmin)';
    document.getElementById('stage').appendChild(m.canvas);
    VM.onFrame(() => m.render({ rx: P.rx, ry: P.ry, rz: P.rz }));
  })();
</script></body></html>
