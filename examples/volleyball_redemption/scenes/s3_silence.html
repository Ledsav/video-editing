<!doctype html>
<html><head><meta charset="utf-8">
<meta name="vedit:kind" content="scene">
<meta name="vedit:duration" content="5">
<meta name="vedit:description" content="03 The Silence: cold rain on an empty court, the ball lies still. Doubt, then the ball's rim catches fire: or you come back.">
<script src="common.js"></script>
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #070b16; }
  #stage { position: absolute; inset: 0; }
</style></head>
<body><div id="stage"></div>
<script>
  const P = VM.params({ line1: 'Some nights,', line2: 'you want to quit.', turn: 'Or you come back.', turnAt: 3.25 });
  const stage = document.getElementById('stage');
  const floor = el('div', { position: 'absolute', left: 0, right: 0, top: '80vh', bottom: 0, background: 'linear-gradient(#0f1628, #070b16)' });
  el('div', { position: 'absolute', left: 0, right: 0, top: '80vh', height: '0.25vmin', background: 'rgba(142,160,196,0.35)' });
  // rain: deterministic streaks
  const R = VM.rand(21), drops = [];
  for (let i = 0; i < 140; i++) drops.push({ x: R() * 110 - 5, y: R() * 120, v: 70 + R() * 60, l: 3 + R() * 6, a: 0.25 + R() * 0.4,
    e: el('div', { position: 'absolute', left: 0, top: 0, width: '0.12vmin', background: 'linear-gradient(rgba(170,190,230,0), rgba(170,190,230,1))' }) });
  // splashes on the floor
  const splashes = [];
  for (let i = 0; i < 26; i++) splashes.push({ x: R() * 100, y: 82 + R() * 16, ph: R(), per: 0.5 + R() * 0.6,
    e: el('div', { position: 'absolute', left: 0, top: 0, width: '2vmin', height: '0.5vmin', marginLeft: '-1vmin', border: '0.12vmin solid rgba(170,190,230,0.6)', borderRadius: '50%' }) });

  const glow = el('div', { position: 'absolute', left: 0, top: 0, width: '60vmin', height: '60vmin', marginLeft: '-30vmin', marginTop: '-30vmin',
    borderRadius: '50%', mixBlendMode: 'screen', background: `radial-gradient(closest-side, ${C.orange}aa, ${C.orange}00)`, opacity: 0 });
  const reflection = el('div', { position: 'absolute', left: 0, top: 0, width: '12vmin', height: '5vmin', marginLeft: '-6vmin',
    borderRadius: '50%', filter: 'blur(1vmin)', background: 'rgba(243,237,226,0.25)' });
  const ball = makeBall(stage, 16, { rim: C.orange, base: '#c9c4bb', panel: '#6c7a99' });
  const rim = ball.el.querySelector('.rim');
  const hot = makeBall(stage, 16, { rim: C.orange });
  const hotRim = hot.el.querySelector('.rim');

  const box = el('div', { position: 'absolute', left: '50vw', top: '30vh', width: '80vw', marginLeft: '-40vw', textAlign: 'center', color: '#cfd7ea' });
  const l1 = el('div', { font: `300 5.6vmin ${TEXT}`, letterSpacing: '0.02em' }, box, P.line1);
  const l2 = el('div', { font: `300 5.6vmin ${TEXT}`, letterSpacing: '0.02em', marginTop: '1vmin' }, box, P.line2);
  const turn = el('div', { position: 'absolute', left: 0, right: 0, top: '33vh', textAlign: 'center', font: `400 11vmin ${DISPLAY}`,
    color: C.orange, letterSpacing: '0.02em' }, stage, P.turn.toUpperCase());
  const u1 = softWords(l1, { t0: 0.35, out: P.turnAt - 0.7, stagger: 0.16 });
  const u2 = softWords(l2, { t0: 1.3, out: P.turnAt - 0.6, stagger: 0.16 });
  const u3 = riseText(turn, { t0: P.turnAt, out: 4.65, stagger: 0.035, dur: 0.7, outDur: 0.3 });
  chapterTag('03', 'THE DOUBT', 0.2, 4.7);
  addFinish({ grain: 0.12, vignette: 0.8 });

  VM.onFrame((t) => {
    const ign = VM.prog(t, P.turnAt - 0.2, 0.8, 'outCubic');
    drops.forEach((d) => { const y = ((d.y + t * d.v) % 120) - 10; d.e.style.height = `${d.l}vh`;
      d.e.style.transform = `translate(${d.x - (y + 10) * 0.08}vw, ${y}vh) rotate(5deg)`; d.e.style.opacity = d.a * (1 - 0.6 * ign); });
    splashes.forEach((s) => { const u = ((t + s.ph * s.per) % s.per) / s.per;
      s.e.style.transform = `translate(${s.x}vw, ${s.y}vh) scale(${0.3 + u * 1.4})`; s.e.style.opacity = (1 - u) * 0.6 * (1 - 0.6 * ign); });
    // the ball lies still, a slow push in; colour returns as it ignites
    const z = 1 + 0.08 * VM.prog(t, 0, 5, 'inOutSine');
    stage.style.transform = `scale(${z})`;
    stage.style.transformOrigin = '50% 72%';
    const by = 80 - 8 * Math.min(innerWidth, innerHeight) / innerHeight;
    const pulse = t > P.turnAt ? 0.04 * Math.max(0, Math.sin((t - P.turnAt) * 9)) * Math.exp(-(t - P.turnAt) * 1.2) : 0;
    ball.set({ x: 50, y: by, rot: 18, scale: 1 + pulse });
    ball.el.style.filter = `saturate(${1 + ign}) brightness(${0.75 + 0.35 * ign})`;
    rim.style.opacity = ign;
    hot.set({ x: 50, y: by, rot: 18, scale: 1 + pulse, opacity: ign }); hotRim.style.opacity = ign;
    reflection.style.transform = `translate(50vw, 81.5vh)`;
    glow.style.transform = `translate(50vw, ${by}vh) scale(${0.6 + 0.5 * ign})`; glow.style.opacity = ign * (0.85 + 0.15 * VM.noise(t * 3, 1));
    u1(t); u2(t); u3(t);
  });
</script></body></html>
