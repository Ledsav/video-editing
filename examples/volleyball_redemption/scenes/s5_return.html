<!doctype html>
<html><head><meta charset="utf-8">
<meta name="vedit:kind" content="scene">
<meta name="vedit:duration" content="5.455">
<meta name="vedit:description" content="05 The Return: the final, down 19-24. Side-view court, every beat a ball crosses the net and lands: 20, 21, 22, 23, 24. One point at a time.">
<script src="common.js"></script>
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0a1020; }
  #stage { position: absolute; inset: 0; }
  svg.court { position: absolute; inset: 0; width: 100vw; height: 100vh; }
</style></head>
<body><div id="stage"></div>
<script>
  const P = VM.params({ beat: 60 / 88, from: 19, away: 24 });
  const b = P.beat, stage = document.getElementById('stage');
  el('div', { position: 'absolute', inset: 0, background: `radial-gradient(ellipse 80% 60% at 50% 30%, #1a2747, ${C.ink})` });
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('class', 'court'); svg.setAttribute('viewBox', '0 0 1920 1080'); svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
  stage.appendChild(svg);
  const FLOOR = 842, NETX = 960, NET_TOP = 470, NET_BOT = 610;
  let mesh = '';
  for (let x = NETX - 6; x <= NETX + 6; x += 6) mesh += `<line x1="${x}" y1="${NET_TOP}" x2="${x}" y2="${NET_BOT}"/>`;
  for (let y = NET_TOP; y <= NET_BOT; y += 14) mesh += `<line x1="${NETX - 6}" y1="${y}" x2="${NETX + 6}" y2="${y}"/>`;
  svg.innerHTML = `
    <line class="floor" x1="0" y1="${FLOOR}" x2="1920" y2="${FLOOR}" stroke="${C.cream}" stroke-opacity="0.45" stroke-width="3"/>
    <line class="post" x1="${NETX}" y1="${FLOOR}" x2="${NETX}" y2="${NET_TOP - 10}" stroke="${C.cream}" stroke-width="5"/>
    <g class="mesh" stroke="${C.cream}" stroke-opacity="0.5" stroke-width="1.5">${mesh}</g>
    <rect class="tape" x="${NETX - 9}" y="${NET_TOP - 6}" width="18" height="10" fill="${C.cream}"/>
    <g class="trails" fill="none" stroke-linecap="round"></g><g class="hits"></g>`;
  const trails = svg.querySelector('.trails'), hits = svg.querySelector('.hits');
  // five rallies won: launch on the left (home), land on the right (away)
  const shots = [[300, 520, 1520], [260, 480, 1660], [340, 560, 1400], [280, 500, 1740], [320, 470, 1580]];
  const arcs = shots.map(([x0, y0, x1], i) => {
    const apex = 400 - i * 10, cx = (x0 + x1) / 2;
    // quadratic through apex: control point so the curve peaks near apex
    const cy = 2 * apex - (y0 + FLOOR) / 2;
    const g = document.createElementNS(ns, 'g'); trails.appendChild(g);
    const dots = Array.from({ length: 34 }, (_, j) => { const u = j / 33, d = document.createElementNS(ns, 'circle');
      d.setAttribute('cx', (1 - u) ** 2 * x0 + 2 * (1 - u) * u * cx + u * u * x1);
      d.setAttribute('cy', (1 - u) ** 2 * y0 + 2 * (1 - u) * u * cy + u * u * (FLOOR - 34));
      d.setAttribute('r', 3.2); d.setAttribute('fill', i === 4 ? C.orange : C.cream); g.appendChild(d); return { d, u }; });
    const ring = document.createElementNS(ns, 'ellipse'); ring.setAttribute('cx', x1); ring.setAttribute('cy', FLOOR);
    ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', C.orange); hits.appendChild(ring);
    return { g, dots, ring, x0, y0, x1, cx, cy };
  });
  const ball = makeBall(stage, 6.5);

  // scoreboard
  const board = el('div', { position: 'absolute', left: 0, right: 0, top: '13vh', textAlign: 'center', color: C.cream });
  el('div', { font: `600 1.9vmin ${TEXT}`, letterSpacing: '0.55em', textIndent: '0.55em', color: C.gold, marginBottom: '1.2vmin' }, board, 'FINAL &nbsp;·&nbsp; FIFTH SET');
  const score = el('div', { font: `400 13vmin ${DISPLAY}`, lineHeight: 1, display: 'flex', justifyContent: 'center', gap: '3vmin' }, board,
    `<span class="h" style="display:inline-block;min-width:1.1em;text-align:right">${P.from}</span><span style="opacity:.35">:</span><span style="display:inline-block;min-width:1.1em;text-align:left">${P.away}</span>`);
  const home = score.querySelector('.h');
  const motto = el('div', { position: 'absolute', left: 0, right: 0, top: '83vh', textAlign: 'center', font: `400 6vmin ${DISPLAY}`,
    letterSpacing: '0.06em', color: C.cream }, stage, 'ONE POINT AT A TIME.');
  const mottoU = riseText(motto, { t0: 5 * b + 0.1, out: 7.5 * b, stagger: 0.025 });
  chapterTag('05', 'THE RETURN', 0.2, 7.5 * b);
  addFinish({ grain: 0.08, vignette: 0.6 });

  const vb = (x, y) => {   // svg (slice) coords -> vw/vh
    const s = Math.max(innerWidth / 1920, innerHeight / 1080);
    return [((x - 960) * s + innerWidth / 2) / innerWidth * 100, ((y - 540) * s + innerHeight / 2) / innerHeight * 100];
  };
  VM.onFrame((t) => {
    // court draws in on the downbeat
    VM.draw(svg.querySelector('.floor'), VM.prog(t, 0, 0.5, 'outExpo'));
    let k = Math.min(4, Math.floor(t / b));            // current rally
    arcs.forEach((a, i) => {
      const p = VM.prog(t, i * b, b, 'linear');
      a.g.style.opacity = i === k && t < (i + 1) * b ? 1 : 0.25;
      a.dots.forEach((d) => (d.d.style.opacity = d.u <= p && t >= i * b ? 1 : 0));
      const r = VM.prog(t, (i + 1) * b, 0.6, 'outCubic');
      a.ring.setAttribute('rx', 10 + r * 120); a.ring.setAttribute('ry', (10 + r * 120) * 0.2);
      a.ring.setAttribute('stroke-width', (1 - r) * 5); a.ring.setAttribute('opacity', t >= (i + 1) * b ? 1 - r : 0);
    });
    // ball position along the current arc (quadratic bezier), then rests at the last landing
    const a = arcs[k], u = Math.min(1, (t - k * b) / b);
    const bx = (1 - u) ** 2 * a.x0 + 2 * (1 - u) * u * a.cx + u * u * a.x1;
    const by = (1 - u) ** 2 * a.y0 + 2 * (1 - u) * u * a.cy + u * u * (FLOOR - 34);
    const [x, y] = vb(bx, t > 5 * b ? FLOOR - 34 - Math.abs(Math.sin((t - 5 * b) * 7)) * 60 * Math.exp(-(t - 5 * b) * 3) : by);
    ball.set({ x, y, rot: t * 520 });
    // score ticks on each landing
    const pts = Math.max(0, Math.min(5, Math.floor((t + 0.001) / b)));
    home.textContent = P.from + pts;
    const hit = pts > 0 ? Math.exp(-(t - pts * b) * 7) : 0;
    home.style.color = VM.mix(C.cream, C.orange, Math.min(1, hit * 1.4));
    home.style.transform = `scale(${1 + 0.2 * hit})`;
    score.style.textShadow = pts === 5 ? `0 0 ${3 * VM.prog(t, 5 * b, 0.5)}vmin ${C.orange}88` : 'none';
    const [sx, sy] = shake(t, pts * b, 0.5, 9, pts);
    stage.style.transform = `translate(${sx}vmin, ${sy}vmin)`;
    mottoU(t);
  });
</script></body></html>
