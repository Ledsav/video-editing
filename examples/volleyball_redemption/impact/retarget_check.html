<!doctype html>
<html><head><meta charset="utf-8">
<meta name="vedit:kind" content="scene">
<meta name="vedit:duration" content="6">
<meta name="vedit:libs" content="three">
<meta name="vedit:description" content="Retarget check: the anime character posed from a mocap clip, with the capture's skeleton (scaled and placed the same way) drawn over it in red, side and front views. Logs per-joint distance (cm) between the character's joints and the capture's. Time = clip time.">
<script>document.write(`<script type="importmap">{"imports":{"three":"${VEDIT.libs.three}"}}<\/script>`);</script>
<script src="loadglb.js"></script>
<script src="mocap.js"></script>
<script src="kit.js"></script>
<style>html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #e9e9ee; } .lab { position: absolute; top: 1vh; font: 600 2vmin sans-serif; color: #223; }</style></head>
<body>
<script type="module">
  const P = VM.params({ clip: 'mocap/3-Dig_in_front_with_one_knee_on_the_ground.glb', model: 'anime_male.glb', raw: 0, nomesh: 0 });
  window.VM_READY = new Promise(async (resolve) => { try {
    const THREE = await import('three');
    const { GLTFLoader } = await import(VEDIT.libs.three_addons + 'loaders/GLTFLoader.js');
    const W = innerWidth, H = innerHeight, V3 = (x, y, z) => new THREE.Vector3(x, y, z);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(W, H); renderer.setScissorTest(true); document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene(); scene.background = new THREE.Color(0xe9e9ee);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x777788, 2.2));
    const grid = new THREE.GridHelper(4, 16, 0x999999, 0xcccccc); scene.add(grid);
    const g = await loadCharacter(THREE, GLTFLoader, P.model), model = g.scene; scene.add(model); if (P.expr) g.expr(P.expr, 1);
    model.traverse((o) => { if (o.isMesh) { o.frustumCulled = false; const op = P.opaque ? 1 : 0.55; o.material = new THREE.MeshLambertMaterial({ name: o.material.name, map: o.material.map, transparent: op < 1 || o.material.transparent, opacity: op, alphaTest: o.material.alphaTest, depthWrite: op >= 1 && !o.material.transparent, side: THREE.DoubleSide }); } });
    if (P.nomesh) model.traverse((o) => { if (o.isMesh) o.visible = false; });
    if (P.kit) paintKit(THREE, model);
    if (P.uvGrid) model.traverse((o) => { if (o.isMesh && /Body_00_SKIN/.test(o.material.name) && o.material.map) {
      const im = o.material.map.image, c = document.createElement('canvas'); c.width = 1024; c.height = 1024; const g = c.getContext('2d'); g.drawImage(im, 0, 0, 1024, 1024);
      const R = [[0, 0, 245, 500, '#ff0000'], [0, 505, 245, 440, '#ffff00'], [780, 0, 244, 500, '#00ff00'], [780, 505, 244, 440, '#00ffff'], [245, 0, 535, 220, '#ff00ff'], [245, 220, 535, 220, '#ff8800'], [245, 440, 535, 160, '#0000ff'], [245, 600, 535, 200, '#8800ff']];
      g.globalAlpha = 0.6; for (const [x, y, w, h, col] of R) { g.fillStyle = col; g.fillRect(x, y, w, h); }
      g.globalAlpha = 1; g.strokeStyle = '#000'; g.lineWidth = 3; for (let x = 0; x <= 1024; x += 64) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 1024); g.stroke(); } for (let y = 0; y <= 1024; y += 64) { g.beginPath(); g.moveTo(0, y); g.lineTo(1024, y); g.stroke(); }
      const t = new THREE.CanvasTexture(c); t.flipY = o.material.map.flipY; t.colorSpace = o.material.map.colorSpace; o.material.map = t; o.material.needsUpdate = true; } });
    if (P.hideMat) model.traverse((o) => { if (o.isMesh && new RegExp(P.hideMat).test(o.material.name)) o.visible = false; });
    const find = (re) => { let f = null; model.traverse((o) => { if (!f && o.isBone && re.test(o.name)) f = o; }); return f; };
    const Pw = (b) => V3(0, 0, 0).setFromMatrixPosition(b.matrixWorld);
    model.updateMatrixWorld(true);
    { const top = find(/HeadTop_End/), toe = find(/LeftToe_End/) || find(/LeftToeBase/);
      model.scale.multiplyScalar(1.92 / (Pw(top).y - Pw(toe).y)); model.updateMatrixWorld(true); }
    const bc = new Map();
    const bone = (n) => { if (!bc.has(n)) { let f = null; const re = new RegExp('^(mixamorig:?)?' + n + '(_\\d+)?$'); model.traverse((o) => { if (!f && o.isBone && re.test(o.name)) f = o; }); bc.set(n, f); } return bc.get(n); };
    const wp = (n) => Pw(bone(n));
    const retarget = makeRetarget(THREE, model, bone);
    const clip = await loadMocap(THREE, GLTFLoader, P.clip);
    const legOf = (p) => p[0].distanceTo(p[1]) + p[1].distanceTo(p[2]);
    const soleToToe = wp('LeftToeBase').y - new THREE.Box3().setFromObject(model).min.y;
    const LEG = legOf([wp('LeftUpLeg'), wp('LeftLeg'), wp('LeftFoot')]);
    const M0 = clip.sample(0), SC = LEG / legOf([M0.LThigh, M0.LShin, M0.LFoot]), piv = M0.Hip.clone().setY(0);
    const ankleRest = wp('LeftFoot').y - new THREE.Box3().setFromObject(model).min.y;
    const xf = (v) => v.clone().sub(piv).multiplyScalar(SC).add(V3(0, -clip.floor * SC + soleToToe, 0));
    xf.footDy = ankleRest - xf(M0.LFoot).y; xf.ik = !P.noik;
    console.error('FOOTDY ' + xf.footDy.toFixed(3) + ' ankleRest ' + ankleRest.toFixed(3) + ' capAnkle ' + xf(M0.LFoot).y.toFixed(3));
    // capture skeleton: red lines (parent links), joints as dots
    const root = await loadGLB(GLTFLoader, P.clip);
    const links = []; root.scene.traverse((o) => { if (o.parent && o.parent.name && o.parent.name !== 'mocap_root' && o.parent !== root.scene && !/Finger/.test(o.name)) links.push([o.parent.name, o.name]); });
    const lineGeo = new THREE.BufferGeometry(); lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(links.length * 6), 3));
    const lines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ color: 0xe0202a, depthTest: false })); lines.renderOrder = 9; scene.add(lines);
    // character skeleton: blue
    const ab = []; model.traverse((o) => { if (o.isBone && o.parent && o.parent.isBone && !/Hand(Thumb|Index|Middle|Ring|Pinky)|_End|HeadTop/.test(o.name)) ab.push([o.parent, o]); });
    const aGeo = new THREE.BufferGeometry(); aGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(ab.length * 6), 3));
    const aLines = new THREE.LineSegments(aGeo, new THREE.LineBasicMaterial({ color: 0x1a50d0, depthTest: false })); aLines.renderOrder = 10; scene.add(aLines);
    const PAIRS = [['Hips', 'Hip'], ['Spine2', 'Chest'], ['Head', 'Head'], ['LeftArm', 'LShoulder'], ['RightArm', 'RShoulder'], ['LeftForeArm', 'LForearm'], ['RightForeArm', 'RForearm'],
      ['LeftHand', 'LHand'], ['RightHand', 'RHand'], ['LeftLeg', 'LShin'], ['RightLeg', 'RShin'], ['LeftFoot', 'LFoot'], ['RightFoot', 'RFoot']];
    const cam = new THREE.PerspectiveCamera(30, (W / 2) / H, 0.05, 50);
    const lab = (x, t) => { const d = document.createElement('div'); d.className = 'lab'; d.style.left = x; d.textContent = t; document.body.appendChild(d); };
    lab('1vw', 'SIDE (red = capture, blue = character)'); lab('51vw', 'FRONT');
    const log = [];
    VM.onFrame((T) => {
      const M = clip.sample(T);
      retarget(M, xf);
      const pa = lineGeo.attributes.position.array; links.forEach(([a, b], i) => { const A = xf(M[a]), B = xf(M[b]); pa.set([A.x, A.y, A.z, B.x, B.y, B.z], i * 6); }); lineGeo.attributes.position.needsUpdate = true;
      const qa = aGeo.attributes.position.array; ab.forEach(([a, b], i) => { const A = Pw(a), B = Pw(b); qa.set([A.x, A.y, A.z, B.x, B.y, B.z], i * 6); }); aGeo.attributes.position.needsUpdate = true;
      const err = PAIRS.map(([a, m]) => `${a}:${(wp(a).distanceTo(xf(M[m])) * 100).toFixed(0)}`).join(' ');
      { const f = (v) => `(${v.x.toFixed(3)},${v.y.toFixed(3)},${v.z.toFixed(3)})`, hipC = wp('Hips'), hipM = xf(M.Hip);
        console.error(`PELVIS t=${T.toFixed(2)} char Hips->LUpLeg ${f(wp('LeftUpLeg').sub(hipC))} RUpLeg ${f(wp('RightUpLeg').sub(hipC))} | capture Hip->LThigh ${f(xf(M.LThigh).sub(hipM))} RThigh ${f(xf(M.RThigh).sub(hipM))} | thigh len char ${wp('LeftUpLeg').distanceTo(wp('LeftLeg')).toFixed(3)} cap ${xf(M.LThigh).distanceTo(xf(M.LShin)).toFixed(3)} shin char ${wp('LeftLeg').distanceTo(wp('LeftFoot')).toFixed(3)} cap ${xf(M.LShin).distanceTo(xf(M.LFoot)).toFixed(3)} | knee err L ${(wp('LeftLeg').distanceTo(xf(M.LShin)) * 100).toFixed(1)}cm`); }
      if (P.yawLog) { const yaw = (v) => Math.atan2(v.x, v.z) * 57.3, fr = (l, r) => { const d = l.clone().sub(r); return yaw(V3(-d.z, 0, d.x)); };   // front = across(L-R) turned by +90 about up
        const cf = (a, b) => yaw(xf(M[b]).sub(xf(M[a]))), hf = (a, b) => yaw(wp(b).sub(wp(a)));
        console.error(`YAW t=${T.toFixed(2)} cap pelvis ${fr(M.LThigh, M.RThigh).toFixed(0)} chest ${fr(M.LShoulder, M.RShoulder).toFixed(0)} toeL ${cf('LFoot', 'LToe').toFixed(0)} toeR ${cf('RFoot', 'RToe').toFixed(0)} | char pelvis ${fr(wp('LeftUpLeg'), wp('RightUpLeg')).toFixed(0)} chest ${fr(wp('LeftArm'), wp('RightArm')).toFixed(0)} toeL ${hf('LeftFoot', 'LeftToeBase').toFixed(0)} toeR ${hf('RightFoot', 'RightToeBase').toFixed(0)}`); }
      console.error(`ERR t=${T.toFixed(2)} ${err} | handGap char ${(wp('LeftHand').distanceTo(wp('RightHand')) * 100).toFixed(0)} cap ${(M.LHand.distanceTo(M.RHand) * SC * 100).toFixed(0)}`);
      const DIRS = [['LeftArm', 'LeftForeArm', 'LShoulder', 'LForearm'], ['LeftForeArm', 'LeftHand', 'LForearm', 'LHand'], ['RightArm', 'RightForeArm', 'RShoulder', 'RForearm'], ['RightForeArm', 'RightHand', 'RForearm', 'RHand'],
        ['LeftUpLeg', 'LeftLeg', 'LThigh', 'LShin'], ['LeftLeg', 'LeftFoot', 'LShin', 'LFoot'], ['Spine', 'Spine1', 'LowerSpine', 'MiddleSpine'], ['Spine1', 'Spine2', 'MiddleSpine', 'Chest'], ['Neck', 'Head', 'Neck', 'Head']];
      console.error(`ANG t=${T.toFixed(2)} ` + DIRS.map(([a, b, c, d]) => `${a}:${(wp(b).sub(wp(a)).angleTo(M[d].clone().sub(M[c])) * 57.3).toFixed(0)}`).join(' '));
      if (T < 0.6 && !window._dumped) { window._dumped = 1; const names = []; model.traverse((o) => { if (o.isBone) names.push(o.name + '<' + (o.parent && o.parent.name)); }); console.error('BONES ' + names.join(' | ')); }
      const h = xf(M.Hip);
      for (const [vx, dir] of (P.backView ? [[0, V3(0, 0, -1)], [W / 2, V3(0, 0, 1)]] : [[0, V3(1, 0, 0)], [W / 2, V3(0, 0, 1)]])) {
        renderer.setViewport(vx, 0, W / 2, H); renderer.setScissor(vx, 0, W / 2, H);
        cam.position.copy(h.clone().add(dir.clone().multiplyScalar(4.2)).setY(P.camY ?? 0.95)); cam.lookAt(h.x, P.camY ? P.camY - 0.1 : 0.85, h.z);
        renderer.render(scene, cam);
      }
    });
    resolve();
  } catch (e) { console.error('ERR ' + e.message + '\n' + e.stack); resolve(); } });
</script></body></html>
