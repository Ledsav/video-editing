<!doctype html>
<html><head><meta charset="utf-8"><meta name="vedit:kind" content="scene"><meta name="vedit:duration" content="0.1"><meta name="vedit:libs" content="three">
<script>document.write(`<script type="importmap">{"imports":{"three":"${VEDIT.libs.three}"}}<\/script>`);</script>
<script src="loadglb.js"></script><script src="mocap.js"></script></head><body>
<script type="module">
  // prints a clip's events and the hip / hand path (debug helper)
  const P = VM.params({ file: 'mocap/1-IDLE.glb', step: 0.1 });
  window.VM_READY = new Promise(async (res) => { try {
    const THREE = await import('three');
    const { GLTFLoader } = await import(VEDIT.libs.three_addons + 'loaders/GLTFLoader.js');
    const m = await loadMocap(THREE, GLTFLoader, P.file); const f = (v) => v.toFixed(2);
    let s = `CLIP ${P.file} dur ${f(m.dur)} floor ${f(m.floor)} takeoff ${f(m.takeoff)} land ${f(m.land)}\n`;
    for (let t = 0; t <= m.dur; t += P.step) { const M = m.sample(t);
      s += `t ${f(t)} hip ${f(M.Hip.x)} ${f(M.Hip.y)} ${f(M.Hip.z)} head ${f(M.Head.x)} ${f(M.Head.y)} ${f(M.Head.z)} rh ${f(M.RHand.x)} ${f(M.RHand.y)} ${f(M.RHand.z)}\n`; }
    console.error(s);
  } catch (e) { console.error('ERR ' + e.message); } res(); });
</script></body></html>
