      }

      const repaint = (meshes, paint) => { for (const o of meshes) { const src = o.userData.toon.map; if (!src || !src.image) continue;

        g.lineTo(cx + w * 0.4, cy - h * 0.3); g.quadraticCurveTo(cx, cy - h * 0.4, cx - w * 0.4, cy - h * 0.3); g.closePath(); g.fill();
